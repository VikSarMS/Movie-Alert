name: booking-watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check BookMyShow
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python poller.py

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"; exit 0
          fi
          git config user.name "booking-watch-bot"
          git config user.email "booking-watch-bot@users.noreply.github.com"
          git add state.json
          git commit -m "Update booking state [skip ci]"
          git push
